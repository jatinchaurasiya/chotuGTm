name: keepalive
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase keep-alive (free tier pauses after 1wk idle)
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/workspaces?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" || exit 1
      - name: App health
        run: curl -sf "https://${{ secrets.SITE_HOST }}/health" -u "${{ secrets.DASHBOARD_USER }}:${{ secrets.DASHBOARD_PASS }}" || true
