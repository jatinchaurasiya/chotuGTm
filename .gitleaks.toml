title = "chotu gitleaks"

[allowlist]
description = "example placeholders"
paths = ['''\\.env\\.example$''', '''README\\.md$''', '''docs/''']
regexes = ['''^(sk-or-v1-)?$''', '''^$''', '''^your.*''', '''^xxx.*''', '''^<.*>$''']

[[rules]]
description = "openrouter key"
regex = '''sk-or-v1-[A-Za-z0-9]{16,}'''
tags = ["openrouter"]

[[rules]]
description = "supabase service role jwt"
regex = '''eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}'''
tags = ["supabase"]
